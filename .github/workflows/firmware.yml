name: Firmware
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Prepare Pico SDK 2.2.0
        run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          test "$(git -C "$RUNNER_TEMP/pico-sdk" rev-parse HEAD)" = "a1438dff1d38bd9c65dbd693f0e5db4b9ae91779"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
      - name: Build firmware
        run: |
          cmake -S . -B build/firmware -G Ninja -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk"
          cmake --build build/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: freertos_desafio-uf2
          path: build/firmware/**/freertos_desafio.uf2
          if-no-files-found: error

